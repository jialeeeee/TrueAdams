name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The whole backend suite, against a throwaway PostgreSQL inside the runner. Run
  # against Supabase in Tokyo, its ~23,500 queries took 30-60 minutes; here, about one.
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # The same major version as the team's Supabase project.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build the test database
        env:
          # A database that exists only for this run, so these are not secrets.
          OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_ROLE_PASSWORD: ci-only
        run: python ci/build_test_database.py

      - name: Run tests
        env:
          # The restricted connectsphere_test role, as on Supabase (db/test_role.sql).
          TEST_DATABASE_URL: postgresql://connectsphere_test:ci-only@localhost:5432/postgres
        run: python -m unittest discover -v

  # The CI database is built from the models, so it can't notice a model that Supabase
  # doesn't match. This checks the real Supabase tables, and the test role's access to
  # them, so a schema script that hasn't been run still fails CI. A few queries only.
  supabase-schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the Supabase tables match the models
        env:
          # Supabase public tables via the restricted connectsphere_test role.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: python -m unittest -v tests.test_app_factory
