name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The whole backend suite, against a throwaway PostgreSQL inside the runner. Run
  # against Supabase in Tokyo, its ~23,500 queries took 30-60 minutes; here, about one.
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # The same major version as the team's Supabase project.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build the test database
        env:
          # A database that exists only for this run, so these are not secrets.
          OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_ROLE_PASSWORD: ci-only
        run: python ci/build_test_database.py

      - name: Run tests
        env:
          # The restricted connectsphere_test role, as on Supabase (db/test_role.sql).
          TEST_DATABASE_URL: postgresql://connectsphere_test:ci-only@localhost:5432/postgres
        run: coverage run -m unittest discover -v

      # Fails below 100% (backend/.coveragerc): a new line needs a test, or a
      # "# pragma: no cover" with the reason it can't have one.
      - name: Coverage
        run: coverage report

  # The frontend suite with coverage; fails below the floor in frontend/vitest.config.js.
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

  # End-to-end (Week 9): the critical journeys through the whole running system, in a
  # real browser, plus genuinely simultaneous requests (e2e/README.md). Everything runs
  # inside the runner: a throwaway PostgreSQL seeded with the demo data, Redis, the API,
  # the Celery worker and beat, and the Vite dev server.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      # A database, broker and accounts that exist only for this run, so not secrets.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECRET_KEY: e2e-only
      JWT_SECRET_KEY: e2e-only-jwt-secret-key-of-32-bytes
      DEMO_PASSWORD: e2e-only-demo-password
      # The hold-expiry check waits for Celery beat (up to 5 minutes), so it runs after
      # merging rather than on every pull request.
      E2E_SLOW: ${{ github.event_name == 'push' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            e2e/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend

      - name: Build and seed the database
        working-directory: backend
        env:
          OWNER_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_ROLE_PASSWORD: e2e-only
        run: |
          python ci/build_test_database.py
          python seed_demo.py

      - name: Start the API, the Celery worker and beat, and the front end
        run: |
          mkdir -p e2e/output
          (cd backend && flask --app wsgi run --port 5000 > ../e2e/output/api.log 2>&1 &)
          (cd backend && celery -A celery_worker.celery worker --loglevel=info > ../e2e/output/worker.log 2>&1 &)
          (cd backend && celery -A celery_worker.celery beat --loglevel=info > ../e2e/output/beat.log 2>&1 &)
          (cd frontend && npx vite --port 5173 --strictPort > ../e2e/output/vite.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && curl -s -o /dev/null http://localhost:5000/api/events/ \
              && grep -q "ready" e2e/output/worker.log && exit 0
            sleep 2
          done
          echo "The stack did not start"; tail -n 50 e2e/output/*.log; exit 1

      - name: Run the end-to-end tests
        run: python -m unittest discover -s e2e -v

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/output/

  # The CI database is built from the models, so it can't notice a model that Supabase
  # doesn't match. This checks the real Supabase tables, and the test role's access to
  # them, so a schema script that hasn't been run still fails CI. A few queries only.
  supabase-schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the Supabase tables match the models
        env:
          # Supabase public tables via the restricted connectsphere_test role.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: python -m unittest -v tests.test_app_factory
