# Inside Docker, Redis is the "redis" service, not localhost as in backend/.env (which is
# for running on your machine). These win over env_file, and load_dotenv() leaves
# variables that are already set alone (SCRUM-86 review).
x-redis-urls: &redis-urls
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: *redis-urls
    ports:
      - "5000:5000"
    depends_on:
      - redis
    command: gunicorn -b 0.0.0.0:5000 wsgi:app

  celery-worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *redis-urls
    depends_on:
      - redis
    command: celery -A celery_worker.celery worker --loglevel=info

  # SCRUM-86: runs the tentative hold expiry check every 5 minutes (app/venues/hold_expiry.py).
  celery-beat:
    build: ./backend
    env_file: ./backend/.env
    environment: *redis-urls
    depends_on:
      - redis
    command: celery -A celery_worker.celery beat --loglevel=info
